name: Release starter generator

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            artifact: linux-x64
            package: tar.gz
          - os: windows-2022
            artifact: windows-x64
            package: zip
          - os: macos-15
            architecture: arm64
            artifact: macos-arm64
            package: dmg
          - os: macos-15-intel
            architecture: x86_64
            artifact: macos-x86_64
            package: dmg
    runs-on: ${{ matrix.os }}
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libx11-dev libxrandr-dev libxinerama-dev libxcursor-dev libxi-dev libgl1-mesa-dev

      - name: Configure
        shell: bash
        run: |
          args=(-DCMAKE_BUILD_TYPE=Release)
          if [[ -n "${{ matrix.architecture }}" ]]; then
            args+=("-DCMAKE_OSX_ARCHITECTURES=${{ matrix.architecture }}")
            args+=("-DCMAKE_OSX_DEPLOYMENT_TARGET=11.0")
          fi
          cmake -S generator -B generator/build "${args[@]}"

      - name: Build
        run: cmake --build generator/build --config Release --parallel

      - name: Test
        run: ctest --test-dir generator/build -C Release --output-on-failure

      - name: Package
        shell: bash
        run: |
          case "${{ matrix.package }}" in
            dmg)
              cmake --build generator/build --config Release --target package-dmg
              cp "generator/build/aura-generator-${{ matrix.artifact }}.dmg" "$GITHUB_WORKSPACE/"
              ;;
            tar.gz)
              cmake --install generator/build --config Release --component generator --prefix "$GITHUB_WORKSPACE/release"
              tar -czf "$GITHUB_WORKSPACE/aura-generator-${{ matrix.artifact }}.tar.gz" \
                -C "$GITHUB_WORKSPACE/release" .
              ;;
            zip)
              cmake --install generator/build --config Release --component generator --prefix "$GITHUB_WORKSPACE/release"
              cd "$GITHUB_WORKSPACE/release"
              cmake -E tar cf "../aura-generator-${{ matrix.artifact }}.zip" --format=zip .
              ;;
          esac

      - name: Attach package to release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$GITHUB_REF_NAME" "aura-generator-${{ matrix.artifact }}.${{ matrix.package }}"
