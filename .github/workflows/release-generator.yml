name: Release starter generator

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            artifact: linux-x64
          - os: windows-2022
            artifact: windows-x64
          - os: macos-14
            artifact: macos-arm64
    runs-on: ${{ matrix.os }}
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libx11-dev libxrandr-dev libxinerama-dev libxcursor-dev libxi-dev libgl1-mesa-dev

      - name: Configure
        run: cmake -S generator -B generator/build -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build generator/build --config Release --parallel

      - name: Test
        run: ctest --test-dir generator/build -C Release --output-on-failure

      - name: Package
        shell: bash
        run: |
          cmake --install generator/build --config Release --component generator --prefix "$GITHUB_WORKSPACE/release"
          cd "$GITHUB_WORKSPACE/release"
          cmake -E tar cf "../aura-generator-${{ matrix.artifact }}.zip" --format=zip .

      - name: Attach package to release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$GITHUB_REF_NAME" "aura-generator-${{ matrix.artifact }}.zip"
